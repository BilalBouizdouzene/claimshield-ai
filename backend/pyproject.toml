[project]
name = "claimshield-ai"
version = "0.2.0"
description = "Local-first automotive insurance speech intelligence and privacy platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.6,<3",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0,<2", "av>=11,<19"]
nlp = ["spacy>=3.7,<4", "presidio-analyzer>=2.2,<3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.5,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

