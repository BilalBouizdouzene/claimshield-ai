<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline local ClaimShield AI</title>
  <desc id="desc">Chaîne de traitement locale, de l'audio importé jusqu'aux exports protégés et à la revue humaine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071224"/><stop offset="1" stop-color="#0d1b37"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#188dff"/><stop offset="1" stop-color="#5141ff"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00bfe9"/><stop offset="1" stop-color="#04d9be"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7650ff"/><stop offset="1" stop-color="#d046f7"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ec9d25"/><stop offset="1" stop-color="#ffcc45"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#35527b" stroke-opacity=".18"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#57b8ff"/></marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#f4f7ff}.subtitle{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#9cb3d7}.card-title{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#f4f7ff}.body{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#a9bfde}.small{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#6ed7ff;letter-spacing:1px}.num{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#fff}.note{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#d9e8ff}.mono{font:500 13px Consolas,monospace;fill:#8bd4ff}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1460" cy="80" r="210" fill="#3d3fff" opacity=".11" filter="url(#glow)"/><circle cx="70" cy="790" r="180" fill="#00bfe9" opacity=".08" filter="url(#glow)"/>
  <text x="70" y="75" class="small">ARCHITECTURE / LOCAL-FIRST</text><text x="70" y="125" class="title">Pipeline de traitement ClaimShield AI</text><text x="70" y="157" class="subtitle">Chaque étape conserve sa provenance et laisse la décision finale au gestionnaire.</text>
  <rect x="1260" y="75" width="270" height="54" rx="27" fill="#0b2f38" stroke="#1dd9bb"/><circle cx="1290" cy="102" r="9" fill="#27e7be"/><text x="1312" y="108" class="note">Traitement local · CPU</text>
  <g transform="translate(40 235)">
    <g><rect width="190" height="285" rx="18" fill="#0c2443" stroke="#2e83db" stroke-width="2"/><circle cx="34" cy="36" r="22" fill="url(#blue)"/><text x="27" y="42" class="num">01</text><text x="22" y="92" class="card-title">Audio réel</text><text x="22" y="128" class="body"><tspan x="22">Microphone ou</tspan><tspan x="22" dy="21">fichier local</tspan></text><path d="M22 188h146" stroke="#2e83db" opacity=".5"/><text x="22" y="221" class="small">ENTRÉE</text><text x="22" y="250" class="mono">WAV · MP3 · M4A</text></g>
    <g transform="translate(220)"><rect width="190" height="285" rx="18" fill="#0c2443" stroke="#2e83db" stroke-width="2"/><circle cx="34" cy="36" r="22" fill="url(#blue)"/><text x="27" y="42" class="num">02</text><text x="22" y="92" class="card-title">Validation</text><text x="22" y="128" class="body"><tspan x="22">Format, taille,</tspan><tspan x="22" dy="21">durée et décodage</tspan></text><path d="M22 188h146" stroke="#2e83db" opacity=".5"/><text x="22" y="221" class="small">GARDE-FOU</text><text x="22" y="250" class="mono">limites configurées</text></g>
    <g transform="translate(440)"><rect width="190" height="285" rx="18" fill="#0b2a43" stroke="#08c7e9" stroke-width="2"/><circle cx="34" cy="36" r="22" fill="url(#cyan)"/><text x="27" y="42" class="num">03</text><text x="22" y="92" class="card-title">ASR local</text><text x="22" y="128" class="body"><tspan x="22">faster-whisper</tspan><tspan x="22" dy="21">CPU INT8</tspan></text><path d="M22 188h146" stroke="#08c7e9" opacity=".5"/><text x="22" y="221" class="small">SORTIE</text><text x="22" y="250" class="mono">texte + timestamps</text></g>
    <g transform="translate(660)"><rect width="190" height="285" rx="18" fill="#112448" stroke="#a45aff" stroke-width="2"/><circle cx="34" cy="36" r="22" fill="url(#violet)"/><text x="27" y="42" class="num">04</text><text x="22" y="92" class="card-title">PII &amp; faits</text><text x="22" y="128" class="body"><tspan x="22">Règles hybrides</tspan><tspan x="22" dy="21">et extraction métier</tspan></text><path d="M22 188h146" stroke="#a45aff" opacity=".5"/><text x="22" y="221" class="small">ANALYSE</text><text x="22" y="250" class="mono">entités + événements</text></g>
    <g transform="translate(880)"><rect width="190" height="285" rx="18" fill="#112448" stroke="#a45aff" stroke-width="2"/><circle cx="34" cy="36" r="22" fill="url(#violet)"/><text x="27" y="42" class="num">05</text><text x="22" y="92" class="card-title">Preuves</text><text x="22" y="128" class="body"><tspan x="22">Alignement texte</tspan><tspan x="22" dy="21">vers l’audio</tspan></text><path d="M22 188h146" stroke="#a45aff" opacity=".5"/><text x="22" y="221" class="small">TRACE</text><text x="22" y="250" class="mono">spans + segments</text></g>
    <g transform="translate(1100)"><rect width="190" height="285" rx="18" fill="#392b19" stroke="#ffbd33" stroke-width="2"/><circle cx="34" cy="36" r="22" fill="url(#amber)"/><text x="27" y="42" class="num">06</text><text x="22" y="92" class="card-title">Revue humaine</text><text x="22" y="128" class="body"><tspan x="22">Client, contrat,</tspan><tspan x="22" dy="21">faits et statuts</tspan></text><path d="M22 188h146" stroke="#ffbd33" opacity=".5"/><text x="22" y="221" class="small">DÉCISION</text><text x="22" y="250" class="mono">validation obligatoire</text></g>
    <g transform="translate(1320)"><rect width="190" height="285" rx="18" fill="#392b19" stroke="#ffbd33" stroke-width="2"/><circle cx="34" cy="36" r="22" fill="url(#amber)"/><text x="27" y="42" class="num">07</text><text x="22" y="92" class="card-title">Exports</text><text x="22" y="128" class="body"><tspan x="22">Audio protégé,</tspan><tspan x="22" dy="21">JSON et dossier</tspan></text><path d="M22 188h146" stroke="#ffbd33" opacity=".5"/><text x="22" y="221" class="small">SORTIES</text><text x="22" y="250" class="mono">provenance conservée</text></g>
    <path d="M198 142H214M418 142H434M638 142H654M858 142H874M1078 142H1094M1298 142H1314" stroke="#58bfff" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <rect x="40" y="590" width="1510" height="170" rx="18" fill="#091a32" stroke="#254a78"/>
  <text x="72" y="632" class="small">STOCKAGE ET RESPONSABILITÉ</text>
  <text x="72" y="677" class="note">SQLite + fichiers locaux</text><text x="72" y="705" class="body">Les sessions, preuves et exports restent dans data/runtime, exclu du dépôt Git.</text>
  <text x="620" y="677" class="note">Provenance</text><text x="620" y="705" class="body">Modèle, source, temps de traitement et actions de revue sont conservés.</text>
  <text x="1120" y="677" class="note">Limite métier</text><text x="1120" y="705" class="body">Le système assiste le gestionnaire ; il ne décide ni fraude ni indemnisation.</text>
  <text x="70" y="835" class="subtitle">ClaimShield AI · documentation technique · version locale</text>
</svg>
